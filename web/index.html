<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AGNI - Fraud Wind Tunnel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body{background:#0b0f17;color:#e5e7eb;font-family:ui-sans-serif,system-ui}
  .card{background:#111827;border:1px solid #1f2937;border-radius:.75rem}
  .chip{font-size:.65rem;padding:.1rem .45rem;border-radius:9999px;border:1px solid #374151}
  .fraud{color:#f87171}.ok{color:#34d399}
  .heat-lo{background:#1f2937}.heat-mid{background:#92400e}.heat-hi{background:#166534}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#1f2937;border-radius:3px}
  @media(max-width:1280px){main{grid-template-columns:1fr!important}section{max-height:none!important}}
</style>
</head>
<body class="min-h-screen">
<header class="flex flex-wrap items-center justify-between gap-2 px-4 sm:px-5 py-3 border-b border-gray-800">
  <div class="flex items-baseline gap-2">
    <h1 class="text-base sm:text-lg font-bold">AGNI <span class="text-orange-400">Fraud Wind Tunnel</span></h1>
    <span id="calBadge" class="chip border-gray-600 text-gray-500">anchor</span>
  </div>
  <div class="flex items-center gap-2">
    <span id="genomeCount" class="chip border-gray-600 text-gray-400">38 vectors</span>
    <span id="tteBadge" class="chip border-orange-500 text-orange-300">TtE -</span>
    <button id="runBtn" class="bg-orange-600 hover:bg-orange-500 text-white text-sm font-semibold px-4 py-1.5 rounded-lg">Run generation</button>
  </div>
</header>

<main class="grid grid-cols-12 gap-3 p-3 sm:p-4">

  <section class="col-span-12 xl:col-span-2 card p-3 flex flex-col max-h-[80vh]">
    <h2 class="font-semibold text-sm">Fraud Genome</h2>
    <input id="gSearch" placeholder="filter..." class="my-2 bg-gray-900 border border-gray-800 rounded px-2 py-1 text-xs"/>
    <ul id="genomeList" class="space-y-1 overflow-y-auto text-xs flex-1"></ul>
    <div id="genomeDetail" class="mt-2 pt-2 border-t border-gray-800 text-[10px] text-gray-400 max-h-40 overflow-y-auto"></div>
  </section>

  <section class="col-span-12 xl:col-span-3 card p-3 flex flex-col max-h-[80vh]">
    <h2 class="font-semibold text-sm">Agent Council</h2>
    <p class="text-[10px] text-gray-500 mb-2">Scout · Forge · Critic</p>
    <div id="council" class="overflow-y-auto text-xs space-y-2 flex-1 font-mono"></div>
  </section>

  <section class="col-span-12 xl:col-span-4 card p-3 flex flex-col max-h-[80vh]">
    <h2 class="font-semibold text-sm">Attack Theater</h2>
    <div id="theater" class="overflow-y-auto space-y-2 text-xs flex-1"></div>
  </section>

  <section class="col-span-12 xl:col-span-3 card p-3 flex flex-col max-h-[80vh]">
    <h2 class="font-semibold text-sm">Defense Console</h2>
    <div id="cards" class="grid grid-cols-2 gap-1 text-center mb-2"></div>
    <canvas id="armsChart" height="110"></canvas>
    <canvas id="baselineChart" height="90" class="mt-2"></canvas>
    <div id="heatmap" class="mt-2 overflow-y-auto max-h-28 text-[9px] grid grid-cols-6 gap-0.5"></div>
    <div id="runlog" class="mt-2 text-[10px] text-gray-500 font-mono overflow-y-auto flex-1"></div>
  </section>
</main>

<footer class="px-5 pb-2 text-[10px] text-gray-600">Sandbox · synthetic identities only</footer>

<script>
let state = {history:[], genomes:[], alerts:[], artifacts:[], agent_log:[], vector_det_rates:{},
  tte_generations:0, loop_gain_auc:0, fidelity_mean:0, baseline_recall:null, calibrated:false};

function metricCards(){
  const h=state.history, last=h[h.length-1]||{};
  const cards=[
    ["ROC AUC",last.roc_auc??"-"],["Recall",last.recall??"-"],
    ["FPR",last.fpr!=null?(last.fpr*100).toFixed(2)+"%":"-"],
    ["Fidelity",state.fidelity_mean||"-"],
    ["Rules rec",last.baseline_recall!=null?(last.baseline_recall*100).toFixed(0)+"%":(state.baseline_recall!=null?(state.baseline_recall*100).toFixed(0)+"%":"-")],
    ["TtE",state.tte_generations||0],
  ];
  document.getElementById("cards").innerHTML=cards.map(([k,v])=>
    `<div class="bg-gray-900/60 rounded py-1.5"><div class="text-[9px] text-gray-500">${k}</div>
     <div class="text-sm font-bold text-orange-300">${v}</div></div>`).join("");
  document.getElementById("tteBadge").textContent="TtE "+(state.tte_generations||0);
  document.getElementById("genomeCount").textContent=(state.genomes||[]).length+" vectors";
  document.getElementById("calBadge").textContent=state.calibrated?"IEEE-CIS calibrated":"offline twin";
  document.getElementById("calBadge").className="chip "+(state.calibrated?"border-green-600 text-green-400":"border-gray-600 text-gray-500");
}

function charts(){
  const labels=state.history.map(h=>"g"+h.generation);
  const mk=(id,datasets)=>{
    const el=document.getElementById(id); if(!el) return;
    const opts={plugins:{legend:{labels:{color:"#9ca3af",font:{size:9}}}},
      scales:{x:{ticks:{color:"#6b7280",fontSize:8}},y:{min:0.5,max:1,ticks:{color:"#6b7280",fontSize:8}}}};
    if(el.chart){el.chart.data.labels=labels; el.chart.data.datasets=datasets; el.chart.update(); return;}
    el.chart=new Chart(el,{type:"line",data:{labels,datasets},options:opts});
  };
  mk("armsChart",[
    {label:"Retrained AUC",data:state.history.map(h=>h.roc_auc),borderColor:"#fb923c",backgroundColor:"#fb923c22",fill:false,tension:.3,pointRadius:2},
    {label:"Frozen AUC",data:state.history.map(h=>h.frozen_auc),borderColor:"#a78bfa",backgroundColor:"#a78bfa22",fill:false,tension:.3,pointRadius:2,spanGaps:true},
  ]);
  mk("baselineChart",[
    {label:"Sentinel recall",data:state.history.map(h=>h.recall),borderColor:"#34d399",tension:.3,pointRadius:2},
    {label:"Rules recall",data:state.history.map(h=>h.baseline_recall),borderColor:"#f87171",tension:.3,pointRadius:2},
  ]);
}

function heatmap(){
  const rates=state.vector_det_rates||{};
  const el=document.getElementById("heatmap");
  const ids=Object.keys(rates).sort().slice(0,36);
  if(!ids.length){el.innerHTML='<span class="text-gray-600 col-span-6">Run loop for vector heatmap</span>'; return;}
  el.innerHTML=ids.map(id=>{
    const r=rates[id];
    const cls=r<0.5?"heat-lo":r<0.8?"heat-mid":"heat-hi";
    return `<div class="${cls} rounded px-0.5 py-1 text-center" title="${id}: ${(r*100).toFixed(0)}%">${id.replace("GEN-","")}</div>`;
  }).join("");
}

function council(){
  const el=document.getElementById("council");
  const logs=(state.agent_log||[]).slice(-20).reverse();
  if(!logs.length){el.innerHTML='<div class="text-gray-600">Agent Council idle — run a generation.</div>'; return;}
  el.innerHTML=logs.map(l=>{
    const col=l.agent==="scout"?"text-blue-300":l.agent==="critic"?"text-purple-300":"text-orange-300";
    return `<div class="border-l-2 border-gray-700 pl-2"><span class="${col} font-semibold">${l.agent}</span>
      <span class="text-gray-600"> gen${l.gen}</span><div class="text-gray-300 mt-0.5">${l.message}</div></div>`;
  }).join("");
}

function genomeList(){
  const q=document.getElementById("gSearch").value.toLowerCase();
  document.getElementById("genomeList").innerHTML=(state.genomes||[]).filter(g=>
    !q||g.name.toLowerCase().includes(q)||g.id.toLowerCase().includes(q))
    .map(g=>`<li><button onclick="showGenome('${g.id}')" class="w-full text-left hover:bg-gray-800 rounded px-1 py-0.5">
      <span class="text-gray-500">${g.id}</span> ${g.tier?`<span class="chip">${g.tier}</span>`:""}
      ${g.name.slice(0,28)}</button></li>`).join("");
}

window.showGenome=function(id){
  const g=state.genomes.find(x=>x.id===id); if(!g) return;
  document.getElementById("genomeDetail").innerHTML=
    `<b>${g.name}</b> [tier ${g.tier||"?"} · ${g.origin||"seed"}]<br>${g.summary||""}`;
};

function theater(){
  const t=document.getElementById("theater");
  const items=[...(state.alerts||[]).map(a=>({t:"txn",ts:a.ts,a})),
    ...(state.artifacts||[]).map(a=>({t:"art",ts:a.ts,a}))].sort((x,y)=>new Date(y.ts)-new Date(x.ts)).slice(0,35);
  if(!items.length){t.innerHTML='<div class="text-gray-600">Press Run generation.</div>'; return;}
  t.innerHTML=items.map(({t:ty,a})=>{
    if(ty==="art"){
      const forge=a.forge_source==="llm"?'<span class="chip border-yellow-500 text-yellow-300">LLM</span>':"";
      return `<div class="border-l-2 border-orange-400 pl-2 py-1"><span class="text-orange-300">${a.kind}</span> ${forge}
        <div class="italic text-gray-300">"${a.text}"</div></div>`;
    }
    const expl=(a.explanations||[]).map(e=>`<span class="chip">${e.feature}</span>`).join(" ");
    return `<div class="border-l-2 ${a.flag?"border-red-500":"border-gray-700"} pl-2 py-1">
      <span class="${a.is_fraud?"fraud":"ok"}">${a.is_fraud?"ATTACK":"flag"} ₹${Number(a.amount).toLocaleString("en-IN")}</span>
      <span class="text-gray-600 float-right">${a.score}</span>
      ${expl?`<div class="mt-0.5">${expl}</div>`:""}</div>`;
  }).join("");
}

async function refresh(){
  const r=await fetch("/api/state"); state=await r.json();
  metricCards(); charts(); heatmap(); council(); genomeList(); theater();
}

document.getElementById("runBtn").onclick=async(e)=>{
  e.target.disabled=true; e.target.textContent="Running...";
  try{
    const r=await fetch("/api/loop/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({generations:1})});
    const d=await r.json();
    (d.agent_log||[]).forEach(l=>{});
    await refresh();
  } finally { e.target.disabled=false; e.target.textContent="Run generation"; }
};
document.getElementById("gSearch").oninput=genomeList;
refresh();
</script>
</body>
</html>
