<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AGNI — Fraud Wind Tunnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/app.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>AGNI <span>WIND TUNNEL</span></h1>
    <span class="sub">closed-loop GenAI payment fraud · red team / blue team</span>
  </div>
  <div class="rubric" id="rubric"></div>
  <div class="actions">
    <span class="badge" id="calBadge">anchor</span>
    <span class="badge" id="llmBadge">llm off</span>
    <button class="btn" id="runBtn">Run generation</button>
  </div>
</header>

<main class="grid">
  <section class="col">
    <h2>Identify · Genome</h2>
    <input class="search" id="gSearch" placeholder="filter id, rail, surface"/>
    <ul class="glist" id="genomeList"></ul>
    <div class="gdetail" id="genomeDetail">Select a vector.</div>
  </section>

  <section class="col">
    <h2>Generate · Attack theater</h2>
    <svg id="mule" viewBox="0 0 640 140" aria-label="Mule ring"></svg>
    <div class="theater" id="theater"></div>
  </section>

  <section class="col">
    <h2>Loop · Agent council</h2>
    <div class="feed" id="council"></div>
  </section>

  <section class="col">
    <h2>Defend · Sentinel</h2>
    <div class="metrics" id="cards"></div>
    <canvas id="armsChart" height="110"></canvas>
    <canvas id="baselineChart" height="90"></canvas>
    <div class="heat" id="heatmap"></div>
    <div class="log" id="runlog"></div>
  </section>
</main>
<footer class="foot">Sandbox · synthetic identities · TTP-level playbooks · IEEE-CIS derived stats only</footer>

<script>
let state = {history:[], genomes:[], alerts:[], artifacts:[], agent_log:[], vector_det_rates:{},
  mule_graph:{}, tte_generations:0, loop_gain_auc:0, fidelity_mean:0, baseline_recall:null,
  calibrated:false, llm_enabled:false};

function rubric(){
  const h=state.history, last=h[h.length-1]||{};
  const cells=[
    ["Identify",(state.genomes||[]).length+" vec"],
    ["Generate",(state.fidelity_mean||"—")],
    ["Defend", last.roc_auc ?? "—"],
    ["Loop","TtE "+(state.tte_generations||0)],
  ];
  document.getElementById("rubric").innerHTML=cells.map(([k,v])=>
    `<div><kbd>${k}</kbd><b class="num">${v}</b></div>`).join("");
}

function cards(){
  const last=(state.history||[])[state.history.length-1]||{};
  const items=[
    ["ROC AUC", last.roc_auc ?? "—"],
    ["Recall", last.recall ?? "—"],
    ["FPR", last.fpr!=null?(last.fpr*100).toFixed(2)+"%":"—"],
    ["Rules rec", last.baseline_recall!=null?(last.baseline_recall*100).toFixed(1)+"%":"—"],
  ];
  document.getElementById("cards").innerHTML=items.map(([k,v])=>
    `<div><kbd>${k}</kbd><b class="num">${v}</b></div>`).join("");
  document.getElementById("calBadge").textContent=state.calibrated?"IEEE-CIS":"offline twin";
  document.getElementById("calBadge").className="badge"+(state.calibrated?" on":"");
  document.getElementById("llmBadge").textContent=state.llm_enabled?"DeepSeek on":"llm off";
  document.getElementById("llmBadge").className="badge"+(state.llm_enabled?" llm":"");
}

function charts(){
  const labels=state.history.map(h=>"g"+h.generation);
  const mk=(id,datasets,ymin)=>{
    const el=document.getElementById(id); if(!el) return;
    const opts={plugins:{legend:{labels:{color:"#7a8896",font:{size:10,family:"IBM Plex Sans"}}}},
      scales:{x:{ticks:{color:"#7a8896",font:{size:9}}},y:{min:ymin,ticks:{color:"#7a8896"}}}};
    if(el.chart){el.chart.data.labels=labels; el.chart.data.datasets=datasets; el.chart.update(); return;}
    el.chart=new Chart(el,{type:"line",data:{labels,datasets},options:opts});
  };
  mk("armsChart",[
    {label:"Retrained",data:state.history.map(h=>h.roc_auc),borderColor:"#e8572a",tension:.25,pointRadius:2,fill:false},
    {label:"Frozen",data:state.history.map(h=>h.frozen_auc),borderColor:"#8b7cf6",tension:.25,pointRadius:2,spanGaps:true,fill:false},
  ],0.5);
  mk("baselineChart",[
    {label:"Sentinel",data:state.history.map(h=>h.recall),borderColor:"#3d9a7a",tension:.25,pointRadius:2,fill:false},
    {label:"Rules",data:state.history.map(h=>h.baseline_recall),borderColor:"#f07a6a",tension:.25,pointRadius:2,fill:false},
  ],0);
}

function heatmap(){
  const rates=state.vector_det_rates||{};
  const ids=Object.keys(rates).sort().slice(0,36);
  const el=document.getElementById("heatmap");
  if(!ids.length){el.innerHTML="<i>—</i>"; return;}
  el.innerHTML=ids.map(id=>{
    const r=rates[id];
    const cls=r<0.5?"lo":r<0.8?"mid":"hi";
    return `<i class="${cls}" title="${id} ${(r*100).toFixed(0)}%">${id.replace("GEN-","")}</i>`;
  }).join("");
}

function mule(){
  const g=state.mule_graph||{};
  const svg=document.getElementById("mule");
  const nodes=g.nodes||[], edges=g.edges||[];
  if(!nodes.length){svg.innerHTML='<text x="16" y="72" fill="#7a8896" font-size="11">Mule graph after a generation</text>'; return;}
  const sink=g.sink;
  const others=nodes.filter(n=>n.id!==sink);
  const cx=520, cy=70;
  let html=`<text x="12" y="18" fill="#7a8896" font-size="10" font-family="IBM Plex Mono">MULE RING · unique-src fan-in</text>`;
  others.forEach((n,i)=>{
    const a=(Math.PI*1.2)*(i/(Math.max(others.length-1,1)))-0.6;
    const x=80+Math.cos(a)*70, y=70+Math.sin(a)*48;
    n._x=x; n._y=y;
    html+=`<line x1="${x}" y1="${y}" x2="${cx}" y2="${cy}" stroke="#1e2a36"/>`;
    html+=`<circle cx="${x}" cy="${y}" r="5" fill="#121922" stroke="#7a8896"/>`;
  });
  html+=`<circle cx="${cx}" cy="${cy}" r="10" fill="#e8572a"/><text x="${cx+16}" y="${cy+4}" fill="#e8edf2" font-size="10" font-family="IBM Plex Mono">${(sink||"sink").slice(0,18)}</text>`;
  svg.innerHTML=html;
}

function council(){
  const logs=(state.agent_log||[]).slice(-16).reverse();
  const el=document.getElementById("council");
  if(!logs.length){el.innerHTML='<div class="msg"><p>Council idle. Run a generation.</p></div>'; return;}
  el.innerHTML=logs.map(l=>`<div class="msg ${l.agent||""}">
    <div class="who"><b>${l.agent||"agent"}</b> · gen ${l.gen}</div>
    <p>${l.message||""}</p></div>`).join("");
}

function genomeList(){
  const q=document.getElementById("gSearch").value.toLowerCase();
  document.getElementById("genomeList").innerHTML=(state.genomes||[]).filter(g=>
    !q || JSON.stringify(g).toLowerCase().includes(q))
    .map(g=>`<li><button onclick="showGenome('${g.id}')">
      <span class="id">${g.id}</span><span class="tier">${g.tier||"B"}</span>${(g.name||"").slice(0,32)}
    </button></li>`).join("");
}

window.showGenome=function(id){
  const g=state.genomes.find(x=>x.id===id); if(!g) return;
  document.getElementById("genomeDetail").innerHTML=
    `<b>${g.name}</b><br>tier ${g.tier||"?"} · ${g.origin||"seed"} · ${(g.rails||[]).join(", ")}<br>${g.summary||""}`;
};

function theater(){
  const t=document.getElementById("theater");
  const items=[...(state.alerts||[]).map(a=>({t:"txn",ts:a.ts,a})),
    ...(state.artifacts||[]).map(a=>({t:"art",ts:a.ts,a}))].sort((x,y)=>new Date(y.ts)-new Date(x.ts)).slice(0,28);
  if(!items.length){t.innerHTML='<div class="card">No kill-chain yet.</div>'; return;}
  t.innerHTML=items.map(({t:ty,a})=>{
    if(ty==="art"){
      const llm=a.forge_source==="llm"?'<span class="llm-tag">FORGE LLM</span>':"";
      return `<div class="card"><span class="k">${a.kind}</span>${llm}<div>${a.text||""}</div></div>`;
    }
    const expl=(a.explanations||[]).map(e=>`<span class="chip">${e.feature}</span>`).join("");
    return `<div class="card"><span class="amt ${a.is_fraud?"fraud":"ok"}">${a.is_fraud?"ATTACK":"FLAG"} ₹${Number(a.amount).toLocaleString("en-IN")}</span>
      <span class="num" style="float:right;color:#7a8896">${a.score}</span>
      <div class="chips">${expl}</div></div>`;
  }).join("");
}

async function refresh(){
  const r=await fetch("/api/state"); state=await r.json();
  rubric(); cards(); charts(); heatmap(); mule(); council(); genomeList(); theater();
}

document.getElementById("runBtn").onclick=async(e)=>{
  e.target.disabled=true; e.target.textContent="Running…";
  try{
    const r=await fetch("/api/loop/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({generations:1})});
    if(!r.ok) throw new Error("run failed");
    await refresh();
  } catch(err){
    document.getElementById("runlog").textContent="Generation timed out or failed on this dyno. Metrics above are from the seeded run.";
  } finally { e.target.disabled=false; e.target.textContent="Run generation"; }
};
document.getElementById("gSearch").oninput=genomeList;
refresh();
</script>
</body>
</html>
