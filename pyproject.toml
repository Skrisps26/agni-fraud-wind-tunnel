[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agni"
version = "0.1.0"
description = "AGNI - Fraud Wind Tunnel: closed-loop GenAI payment-fraud red team (identify / generate / defend)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
llm = ["openai>=1.30"]           # optional LLM enrichment for playbooks/judge/critic
explain = ["shap>=0.45"]

[project.scripts]
agni = "agni.loop.redqueen:main"

[tool.setuptools.packages.find]
include = ["agni*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
